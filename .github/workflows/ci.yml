# CI (see docs/plan.md section 11 and docs/process.md).
# The main ruleset requires the status check "ci". Do NOT rename the job.
# Backend (ruff, mypy, pytest against a Postgres 16 service) and frontend run in this one job.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the backend "DB up" tests. CI-only credentials.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Backend install (uv sync)
        working-directory: backend
        run: uv sync --locked

      - name: Backend lint (ruff)
        working-directory: backend
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .

      - name: Backend type-check (mypy)
        working-directory: backend
        run: uv run --locked mypy

      - name: Backend tests (pytest)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
          REQUIRE_DB_TESTS: "1"
        run: uv run --locked pytest

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Frontend type-check (tsc --noEmit)
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build
